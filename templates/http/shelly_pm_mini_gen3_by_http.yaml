zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 9702754414644deba5cb4ed3e9f33594
      name: Templates/IoT
  templates:
    - uuid: 0bf8fce47cb644a7b1dee0c8a479abcf
      template: 'Shelly PM Mini Gen3 by HTTP'
      name: 'Shelly PM Mini Gen3 by HTTP'
      description: |
        Shelly PM Mini Gen3 (S3PM-001PCEU16) — single-channel energy meter,
        monitored over the local HTTP RPC API. Links "Shelly Gen2 Gen3 common by
        HTTP"; adds the pm1:0 metering component.

        HTTP counterpart of the MQTT template "Shelly PM Mini Gen3 by MQTT".
        Use HTTP when the device is reachable from the Zabbix server/proxy and
        you prefer polling; use MQTT when the device publishes to a broker.

        Import the common base FIRST. Give the host an interface with the device IP (discovery adds it automatically; the item URL uses {HOST.CONN}).
      templates:
        - name: 'Shelly Gen2 Gen3 common by HTTP'
      groups:
        - name: Templates/IoT
      macros:
        - macro: '{$SHELLY.MODEL}'
          value: 'S3PM-001PCEU16'
          description: 'Device model/SKU, fed to host inventory Model.'
        - macro: '{$SHELLY.POWER.MAX}'
          value: '2000'
          description: 'High active-power warning threshold, watts.'
      items:
        - uuid: b5bd3ed319914cc58efd6a61909b9539
          name: 'PM1: Active power'
          type: DEPENDENT
          key: 'shelly.pm1.apower'
          value_type: FLOAT
          units: W
          master_item:
            key: 'shelly.http.status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["pm1:0"].apower'
          tags:
            - tag: component
              value: power
        - uuid: 5e91ab4fbaf5442c8bfda4c47d85b4f6
          name: 'PM1: Voltage'
          type: DEPENDENT
          key: 'shelly.pm1.voltage'
          value_type: FLOAT
          units: V
          master_item:
            key: 'shelly.http.status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["pm1:0"].voltage'
          tags:
            - tag: component
              value: power
        - uuid: 99ab7e0449df474eb114202410adf4b5
          name: 'PM1: Current'
          type: DEPENDENT
          key: 'shelly.pm1.current'
          value_type: FLOAT
          units: A
          master_item:
            key: 'shelly.http.status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["pm1:0"].current'
          tags:
            - tag: component
              value: power
        - uuid: f21338aa7729418f835b1e9610b45299
          name: 'PM1: Frequency'
          type: DEPENDENT
          key: 'shelly.pm1.freq'
          value_type: FLOAT
          units: Hz
          master_item:
            key: 'shelly.http.status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["pm1:0"].freq'
          tags:
            - tag: component
              value: power
        - uuid: 1a40cf9fdd3c41d7abe6095da7e21c0e
          name: 'PM1: Energy total'
          type: DEPENDENT
          key: 'shelly.pm1.aenergy.total'
          value_type: FLOAT
          units: Wh
          master_item:
            key: 'shelly.http.status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["pm1:0"].aenergy.total'
          tags:
            - tag: component
              value: energy
        - uuid: 880f59025b3a4b03b7a0e8c997e8b132
          name: 'PM1: Energy last minute'
          type: DEPENDENT
          key: 'shelly.pm1.aenergy.by_minute'
          value_type: FLOAT
          units: Wh
          description: 'Energy consumed in the last complete minute (aenergy.by_minute[0]). Source unit is mWh; preprocessed ×0.001 to Wh. Only present when device clock is synced.'
          master_item:
            key: 'shelly.http.status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["pm1:0"].aenergy.by_minute[0]'
            - type: MULTIPLIER
              parameters:
                - '0.001'
          tags:
            - tag: component
              value: energy

        - uuid: 3b74c80e62b447a1be9ab5491f29939f
          name: 'PM1: Power factor'
          type: DEPENDENT
          key: 'shelly.pm1.pf'
          value_type: FLOAT
          master_item:
            key: 'shelly.http.status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["pm1:0"].pf'
          tags:
            - tag: component
              value: power
        - uuid: 2607400bcddc4274b4fc6e9a87c967fe
          name: 'PM1: Apparent power'
          type: DEPENDENT
          key: 'shelly.pm1.aprtpower'
          value_type: FLOAT
          units: VA
          master_item:
            key: 'shelly.http.status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["pm1:0"].aprtpower'
          tags:
            - tag: component
              value: power
        - uuid: 90c39ed6df04490b8bd3c775ef2dd3be
          name: 'PM1: Errors'
          type: DEPENDENT
          key: 'shelly.pm1.errors'
          value_type: UNSIGNED
          description: 'Active fault flags (power_meter_failure, out_of_range:*). 1 = at least one fault active, 0 = none.'
          master_item:
            key: 'shelly.http.status'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var e=JSON.parse(value)["pm1:0"].errors; return (Array.isArray(e)&&e.length>0)?1:0;'
          tags:
            - tag: component
              value: fault

        - uuid: 8800ab271f804d8a96c5532c80066b4e
          name: 'PM1: Returned energy total'
          type: DEPENDENT
          key: 'shelly.pm1.ret_aenergy.total'
          value_type: FLOAT
          units: Wh
          master_item:
            key: 'shelly.http.status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["pm1:0"].ret_aenergy.total'
          tags:
            - tag: component
              value: energy
        - uuid: 7bd43215930741bba455d56e0261fbd3
          name: 'Model'
          type: DEPENDENT
          key: 'shelly.model'
          value_type: CHAR
          inventory_link: MODEL
          master_item:
            key: 'shelly.http.status'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return "{$SHELLY.MODEL}";'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          tags:
            - tag: component
              value: inventory
  triggers:
    - uuid: 7f4d40cb5e2f4d9a8b1c6e3a2f5d9e01
      expression: 'last(/Shelly PM Mini Gen3 by HTTP/shelly.pm1.apower)>{$SHELLY.POWER.MAX}'
      name: 'Shelly PM Mini: High active power (>{$SHELLY.POWER.MAX} W)'
      priority: WARNING
      description: 'Active power exceeded the threshold.'
    - uuid: d6a539520fa743aca8e2cb1690981d0f
      expression: 'last(/Shelly PM Mini Gen3 by HTTP/shelly.pm1.errors)=1'
      name: 'Shelly PM: Fault active'
      priority: HIGH
      description: 'One or more fault flags are set on pm1:0 (power_meter_failure, out_of_range:*).'
